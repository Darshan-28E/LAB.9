
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #edf2f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #243b64;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 18px;
        }

        button {
            display: block;
            margin: 30px auto;
            padding: 16px 35px;
            background: #243b64;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #4269a8;
        }

        #message {
            text-align: center;
            font-size: 18px;
            margin: 20px;
        }

        .table-box {
            overflow-x: auto;
            margin-top: 35px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #243b64;
            color: white;
            padding: 20px;
            font-size: 17px;
        }

        td {
            padding: 17px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #333;
        }

        tbody tr:nth-child(even) {
            background: #f2f6fc;
        }

        tbody tr:hover {
            background: #e1ebfa;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 35px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Information System</h1>

    <p class="subtitle">
        Employee details retrieved from an XML file
    </p>

    <button onclick="loadEmployees()">
        Load Employee Data
    </button>

    <p id="message">
        Click the button to load employee information.
    </p>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary (₹)</th>
                </tr>
            </thead>

            <tbody id="employeeData">
            </tbody>
        </table>
    </div>

    <footer>
        Employee Management System | XML Data Display
    </footer>

</div>

<script>

// XML DATA
// Do not add <?xml version="1.0"?> inside this string.

const xmlData = `<employees>

    <employee>
        <id>101</id>
        <name>Rahul Sharma</name>
        <department>IT</department>
        <designation>Software Developer</designation>
        <salary>45000</salary>
    </employee>

    <employee>
        <id>102</id>
        <name>Priya Kumar</name>
        <department>HR</department>
        <designation>HR Manager</designation>
        <salary>55000</salary>
    </employee>

    <employee>
        <id>103</id>
        <name>Arjun Reddy</name>
        <department>Finance</department>
        <designation>Accountant</designation>
        <salary>40000</salary>
    </employee>

    <employee>
        <id>104</id>
        <name>Sneha Patel</name>
        <department>Marketing</department>
        <designation>Marketing Executive</designation>
        <salary>38000</salary>
    </employee>

    <employee>
        <id>105</id>
        <name>Vikram Singh</name>
        <department>IT</department>
        <designation>System Analyst</designation>
        <salary>60000</salary>
    </employee>

</employees>`;


// FUNCTION TO READ XML DATA
function loadEmployees() {

    const parser = new DOMParser();

    const xml = parser.parseFromString(
        xmlData, "application/xml"
    );

    if (xml.getElementsByTagName("parsererror").length > 0) {
        document.getElementById("message").textContent =
            "Error: Invalid XML data!";
        return;
    }

    const employees = xml.getElementsByTagName("employee");

    const table = document.getElementById("employeeData");

    table.innerHTML = "";

    for (let i = 0; i < employees.length; i++) {

        const emp = employees[i];

        const id = emp.getElementsByTagName("id")[0].textContent;
        const name = emp.getElementsByTagName("name")[0].textContent;
        const department = emp.getElementsByTagName("department")[0].textContent;
        const designation = emp.getElementsByTagName("designation")[0].textContent;
        const salary = emp.getElementsByTagName("salary")[0].textContent;

        const row = document.createElement("tr");

        const values = [
            id,
            name,
            department,
            designation,
            "₹" + salary
        ];

        values.forEach(value => {

            const cell = document.createElement("td");

            cell.textContent = value;

            row.appendChild(cell);

        });

        table.appendChild(row);
    }

    document.getElementById("message").textContent =
        employees.length + " employees loaded successfully!";

    document.getElementById("message").style.color = "green";
}

</script>

</body>
</html>
